<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 4: Bomber Jacket (Black with accent stripes) -->
  <defs>
    <style>
      .pixel-rect { shape-rendering: crispEdges; }
    </style>
  </defs>
  
  <!-- Main Jacket Body (Black #1A1A1A) -->
  <rect class="pixel-rect" x="4" y="8" width="16" height="12" fill="#1A1A1A"/>
  
  <!-- Collar/Lapel Left -->
  <rect class="pixel-rect" x="4" y="7" width="4" height="2" fill="#1A1A1A"/>
  <rect class="pixel-rect" x="4" y="6" width="3" height="1" fill="#1A1A1A"/>
  
  <!-- Collar/Lapel Right -->
  <rect class="pixel-rect" x="16" y="7" width="4" height="2" fill="#1A1A1A"/>
  <rect class="pixel-rect" x="17" y="6" width="3" height="1" fill="#1A1A1A"/>
  
  <!-- Sleeves (extended) -->
  <rect class="pixel-rect" x="2" y="9" width="2" height="8" fill="#1A1A1A"/>
  <rect class="pixel-rect" x="20" y="9" width="2" height="8" fill="#1A1A1A"/>
  
  <!-- Sleeve Cuffs (ribbed - gold accent) -->
  <rect class="pixel-rect" x="2" y="16" width="2" height="2" fill="#DAA520"/>
  <rect class="pixel-rect" x="20" y="16" width="2" height="2" fill="#DAA520"/>
  
  <!-- Zipper (center line - gold) -->
  <rect class="pixel-rect" x="11" y="8" width="1" height="11" fill="#DAA520"/>
  
  <!-- Zipper Detail (small rectangles) -->
  <rect class="pixel-rect" x="10" y="9" width="1" height="1" fill="#DAA520"/>
  <rect class="pixel-rect" x="12" y="9" width="1" height="1" fill="#DAA520"/>
  
  <rect class="pixel-rect" x="10" y="12" width="1" height="1" fill="#DAA520"/>
  <rect class="pixel-rect" x="12" y="12" width="1" height="1" fill="#DAA520"/>
  
  <rect class="pixel-rect" x="10" y="15" width="1" height="1" fill="#DAA520"/>
  <rect class="pixel-rect" x="12" y="15" width="1" height="1" fill="#DAA520"/>
  
  <!-- Side Stripe Accent (gold) -->
  <rect class="pixel-rect" x="3" y="10" width="1" height="8" fill="#DAA520"/>
  <rect class="pixel-rect" x="20" y="10" width="1" height="8" fill="#DAA520"/>
  
  <!-- Waist Band (ribbed bottom - gold) -->
  <rect class="pixel-rect" x="4" y="20" width="16" height="1" fill="#DAA520"/>
  
  <!-- Jacket Hem Detail -->
  <rect class="pixel-rect" x="5" y="19" width="2" height="1" fill="#DAA520"/>
  <rect class="pixel-rect" x="17" y="19" width="2" height="1" fill="#DAA520"/>
</svg>
