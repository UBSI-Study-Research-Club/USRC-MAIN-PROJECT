<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 1: Body & Skin (Light) - Grid 24x24 -->
  <!-- Skin color: #F4C8A0 (terang) -->
  <defs>
    <style>
      .px-light { fill: #F4C8A0; }
      .px-border { fill: #1A1A1A; stroke: none; }
    </style>
  </defs>

  <!-- Head -->
  <rect class="px-light" x="8" y="4" width="8" height="8" />
  <!-- Neck -->
  <rect class="px-light" x="10" y="12" width="4" height="2" />
  <!-- Body (Torso) -->
  <rect class="px-light" x="8" y="14" width="8" height="6" />
  <!-- Left Arm -->
  <rect class="px-light" x="4" y="14" width="4" height="6" />
  <!-- Right Arm -->
  <rect class="px-light" x="16" y="14" width="4" height="6" />
  <!-- Left Leg -->
  <rect class="px-light" x="8" y="20" width="3" height="4" />
  <!-- Right Leg -->
  <rect class="px-light" x="13" y="20" width="3" height="4" />

  <!-- Border definition (optional for outline) -->
  <g id="layer-body" style="display: block;">
    <!-- Container for this layer -->
  </g>
</svg>