<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Layer 3: Wajah — Fokus (mata menyipit, alis turun/kerut) -->
  <g id="layer-face" data-style="face-focus">
    <!-- Alis kiri (miring ke dalam — kerutan fokus) -->
    <rect x="8" y="7" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="9" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="10" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Alis kanan (miring ke dalam) -->
    <rect x="13" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="14" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="15" y="7" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Mata kiri — menyipit (hanya 1 baris) -->
    <rect x="8" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="9" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="10" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <!-- Mata kanan — menyipit -->
    <rect x="13" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="14" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="15" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
  </g>
</svg>
