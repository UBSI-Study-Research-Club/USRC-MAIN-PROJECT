<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Layer 3: Wajah — Kacamata (mata normal + frame kacamata bulat) -->
  <g id="layer-face" data-style="face-glasses">
    <!-- Alis kiri -->
    <rect x="8" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="9" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="10" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Alis kanan -->
    <rect x="13" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="14" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="15" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Mata kiri (2x2) -->
    <rect x="8" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="9" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="8" y="9" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="9" y="9" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <!-- Mata kanan (2x2) -->
    <rect x="14" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="15" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="14" y="9" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="15" y="9" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <!-- Frame kacamata kiri -->
    <rect x="7" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="8" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="9" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="10" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="7" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="10" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="7" y="9" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="10" y="9" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="7" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="8" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="9" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="10" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <!-- Jembatan kacamata (tengah) -->
    <rect x="11" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="12" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <!-- Frame kacamata kanan -->
    <rect x="13" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="14" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="15" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="16" y="7" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="13" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="16" y="8" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="13" y="9" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="16" y="9" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="13" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="14" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="15" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
    <rect x="16" y="10" width="1" height="1" fill="var(--glasses-color, #374151)" />
  </g>
</svg>
