<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Layer 3: Wajah — Senyum (mata bulan sabit, alis rileks) -->
  <g id="layer-face" data-style="face-smile">
    <!-- Alis kiri (sedikit naik di luar) -->
    <rect x="8" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="9" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="10" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Alis kanan (sedikit naik di luar) -->
    <rect x="13" y="5" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="14" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <rect x="15" y="6" width="1" height="1" fill="var(--eyebrow-color, #2C1B0E)" />
    <!-- Mata kiri — bulan sabit (hanya baris bawah, senyum) -->
    <rect x="8" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="9" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="10" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <!-- Mata kanan — bulan sabit -->
    <rect x="13" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="14" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
    <rect x="15" y="8" width="1" height="1" fill="var(--eye-color, #1A1A2E)" />
  </g>
</svg>
