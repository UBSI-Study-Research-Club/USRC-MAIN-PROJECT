<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 1: Body & Skin (Medium/Sawo Matang) - Grid 24x24 -->
  <!-- Skin color: #D4A574 (sawo matang) -->
  <defs>
    <style>
      .px-medium { fill: #D4A574; }
    </style>
  </defs>

  <!-- Head -->
  <rect class="px-medium" x="8" y="4" width="8" height="8" />
  <!-- Neck -->
  <rect class="px-medium" x="10" y="12" width="4" height="2" />
  <!-- Body (Torso) -->
  <rect class="px-medium" x="8" y="14" width="8" height="6" />
  <!-- Left Arm -->
  <rect class="px-medium" x="4" y="14" width="4" height="6" />
  <!-- Right Arm -->
  <rect class="px-medium" x="16" y="14" width="4" height="6" />
  <!-- Left Leg -->
  <rect class="px-medium" x="8" y="20" width="3" height="4" />
  <!-- Right Leg -->
  <rect class="px-medium" x="13" y="20" width="3" height="4" />

  <!-- Layer definition -->
  <g id="layer-body" style="display: block;">
    <!-- Container for this layer -->
  </g>
</svg>