<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <!-- USRC logo — interlocked hexagon rings (weave via masks), transparent background -->
  <defs>
    <mask id="mT">
      <rect width="400" height="420" fill="#fff"/>
      <circle cx="273.6" cy="130.2" r="10" fill="#000"/>
      <circle cx="243.6" cy="167.8" r="10" fill="#000"/>
      <circle cx="156.4" cy="167.8" r="10" fill="#000"/>
    </mask>
    <mask id="mBL">
      <rect width="400" height="420" fill="#fff"/>
      <circle cx="200" cy="257.7" r="10" fill="#000"/>
      <circle cx="126.4" cy="130.2" r="10" fill="#000"/>
    </mask>
    <mask id="mBR">
      <rect width="400" height="420" fill="#fff"/>
      <circle cx="200" cy="122.3" r="10" fill="#000"/>
      <circle cx="156.4" cy="167.8" r="10" fill="#000"/>
    </mask>
  </defs>

  <g fill="none" stroke="#FFFFFF" stroke-width="10">
    <!-- top hexagon (under at D,E,F) -->
    <polygon mask="url(#mT)" points="200,23 273.6,65.5 273.6,150.5 200,193 126.4,150.5 126.4,65.5"/>
    <!-- bottom-left hexagon (under at B,C) -->
    <polygon mask="url(#mBL)" points="170,105 243.6,147.5 243.6,232.5 170,275 96.4,232.5 96.4,147.5"/>
    <!-- bottom-right hexagon (under at A,F) -->
    <polygon mask="url(#mBR)" points="230,105 303.6,147.5 303.6,232.5 230,275 156.4,232.5 156.4,147.5"/>

    <!-- over-strand redraws -->
    <line x1="188.74" y1="128.8" x2="211.26" y2="115.8"/>  <!-- A: BL over BR -->
    <line x1="188.74" y1="251.2" x2="211.26" y2="264.2"/>  <!-- B: BR over BL -->
    <line x1="126.4"  y1="117.2" x2="126.4"  y2="143.2"/>  <!-- C: T over BL -->
    <line x1="262.34" y1="123.7" x2="284.86" y2="136.7"/>  <!-- D: BR over T -->
    <line x1="243.6"  y1="154.8" x2="243.6"  y2="180.8"/>  <!-- E: BL over T -->
    <line x1="156.4"  y1="154.8" x2="156.4"  y2="180.8"/>  <!-- F: BR over T -->
  </g>

  <!-- center core -->
  <polygon fill="#FFFFFF" points="200,172 217.3,182 217.3,202 200,212 182.7,202 182.7,182"/>

  <!-- wordmark -->
  <text x="200" y="365" text-anchor="middle"
        font-family="Outfit, Montserrat, Arial, sans-serif"
        font-size="66" font-weight="800" fill="#FFFFFF"
        letter-spacing="8">USRC</text>
  <text x="200" y="400" text-anchor="middle"
        font-family="IBM Plex Mono, Courier New, monospace"
        font-size="14" font-weight="600" fill="#FFFFFF"
        letter-spacing="4">UBSI STUDY AND RESEARCH CLUB</text>
</svg>
